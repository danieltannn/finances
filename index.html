function parseCSVLine(line){
  var out=[],cur="",inQ=false;
  for(var i=0;i<line.length;i++){var c=line[i];if(c==='"')inQ=!inQ;else if(c===','&&!inQ){out.push(cur.trim());cur="";}else cur+=c;}
  out.push(cur.trim());return out;
}

function parseCSV(text){

    var ty=v[1],ac=v[3];if(["Trade","Receive Deliver"].indexOf(ty)<0||!ac)continue;

    if(!nk.has(k)){added.push(r);nk.add(k);}

function detectStrategy(openLegs){

  var puts=openLegs.filter(function(l){return l.cp==="PUT";});
  var calls=openLegs.filter(function(l){return l.cp==="CALL";});
  var longs=openLegs.filter(function(l){return l.ac==="BUY_TO_OPEN";});
  var longPuts=puts.filter(function(l){return l.ac==="BUY_TO_OPEN";});

    var longQty=longPuts.reduce(function(s,l){return s+l.q;},0);
    var shortQty=shortPuts.reduce(function(s,l){return s+l.q;},0);

            posMap[newPid]={id:newPid,und:pu,openDate:tx.d,closeDate:null,isOpen:true,
              txns:[Object.assign({},tx,{legs:mo})],openLegs:mo.slice(),
              strategy:'credit_spread',pnl:0};
            mo.forEach(function(l){symMap[l.sy]=newPid;});
          }else{
            /* All other strategies (1-1-2, strangle): keep roll as one position */
            posMap[pid].txns.push(Object.assign({},tx,{legs:pcl.concat(mo)}));
            posMap[pid].openLegs=posMap[pid].openLegs.concat(mo);
            pcl.forEach(function(l){delete symMap[l.sy];});
            mo.forEach(function(l){symMap[l.sy]=pid;});
            if(mo.length)usedUnds.add(pu);
            var still=Object.values(symMap).includes(pid);
            posMap[pid].isOpen=still||mo.length>0;
          }
        });
        Object.entries(undToOpens).forEach(function(e){
          var u=e[0],legs=e[1];if(usedUnds.has(u))return;
          var pid=tx.oi+"_"+u.replace(/[\/\.\s]/g,"");
          posMap[pid]={id:pid,und:u,openDate:tx.d,closeDate:null,isOpen:true,txns:[Object.assign({},tx,{legs:legs})],openLegs:legs.slice(),strategy:overrides[pid]||detectStrategy(legs),pnl:0};
          legs.forEach(function(l){symMap[l.sy]=pid;});
        });
      }
    }
  });
  Object.values(posMap).forEach(function(pos){
    pos.pnl=pos.txns.reduce(function(s,t){return s+t.legs.reduce(function(ss,l){return ss+l.to;},0);},0);
    if(overrides[pos.id])pos.strategy=overrides[pos.id];
  });
  return Object.values(posMap).sort(function(a,b){return new Date(b.openDate)-new Date(a.openDate);});
}
function daysInTrade(pos){var ms=new Date(pos.closeDate||Date.now()).getTime()-new Date(pos.openDate).getTime();return Math.max(0,Math.round(ms/86400000));}
function posQty(pos){
  var all=pos.txns.reduce(function(a,t){return a.concat(t.legs);},[]);
  var o=all.filter(function(l){return l.ac==="BUY_TO_OPEN"||l.ac==="SELL_TO_OPEN";}).reduce(function(s,l){return s+l.q;},0);
  var c=all.filter(function(l){return l.ac==="BUY_TO_CLOSE"||l.ac==="SELL_TO_CLOSE";}).reduce(function(s,l){return s+l.q;},0);
  return{o:o,c:c};
}
function fmtD(d,s){if(!d)return"—";var dt=new Date(d);return s?dt.toLocaleDateString("en-SG",{day:"2-digit",month:"short"}):dt.toLocaleDateString("en-SG",{day:"2-digit",month:"short",year:"2-digit"});}
function fmtPnL(n,sign){sign=(sign===undefined?true:sign);return(n>=0?(sign?"+":""):"-")+"$"+Math.abs(n).toFixed(2);}
function fmtK(n){var abs=Math.abs(n),s=n>=0?"+":"-";return abs>=1000?(s+"$"+(abs/1000).toFixed(1)+"K"):(s+"$"+abs.toFixed(0));}
var fmtAct=function(ac){return({BUY_TO_OPEN:"Buy Open",SELL_TO_OPEN:"Sell Open",BUY_TO_CLOSE:"Buy Close",SELL_TO_CLOSE:"Sell Close"}[ac]||ac);};

/* Strategy colours used only for the 3-px left border on rows */
var STRATS=[
  {v:"112",          label:"1-1-2",        color:"#a78bfa"},
  {v:"strangle",     label:"Strangle",      color:"#38bdf8"},
  {v:"credit_spread",label:"Credit Spread", color:"#fbbf24"},
  {v:"misc",         label:"Misc",          color:"#555555"}
];
var SMAP=STRATS.reduce(function(m,s){m[s.v]=s;return m;},{});
var MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

function computeAccountMetrics(positions,rows,money){
  var deposits=money.filter(function(m){return m.st==="Deposit";}).reduce(function(s,m){return s+m.to;},0);
  var interest=money.filter(function(m){return m.st==="Credit Interest";}).reduce(function(s,m){return s+m.to;},0);
  var balAdj=money.filter(function(m){return m.st==="Balance Adjustment";}).reduce(function(s,m){return s+m.to;},0);
  var depositCount=money.filter(function(m){return m.st==="Deposit";}).length;
  var closed=positions.filter(function(p){return!p.isOpen;});
  var open=positions.filter(function(p){return p.isOpen;});
  var realizedPnL=closed.reduce(function(s,p){return s+p.pnl;},0);
  var openPremium=open.reduce(function(s,p){return s+p.pnl;},0);
  var commissions=rows.reduce(function(s,r){return s+r.co+r.fe;},0);
  var wins=closed.filter(function(p){return p.pnl>0;}).length;
  return{deposits:deposits,interest:interest,balAdj:balAdj,depositCount:depositCount,
    realizedPnL:realizedPnL,openPremium:openPremium,commissions:commissions,
    estBalance:deposits+interest+balAdj+realizedPnL+openPremium,
    openCount:open.length,closedCount:closed.length,wins:wins,
    winRate:closed.length?Math.round(wins/closed.length*100):0};
}
/* Consolidate futures contract months: /MESZ6→/MES, /CLN6→/CL. Equities unchanged. */
function baseTicker(u){
  if(!u||u[0]!='/') return u;
  var last2=u.slice(-2);
  if('FGHJKMNQUVXZ'.indexOf(last2[0])!==-1&&/[0-9]/.test(last2[1])) return u.slice(0,-2);
  return u;
}
function computeStrategyMetrics(positions){
  var byS={};
  positions.forEach(function(pos){
    if(!byS[pos.strategy])byS[pos.strategy]={closed:[],open:[]};
    (pos.isOpen?byS[pos.strategy].open:byS[pos.strategy].closed).push(pos);
  });
  var result={};
  Object.entries(byS).forEach(function(e){
    var strat=e[0],closed=e[1].closed,open=e[1].open;
    var wins=closed.filter(function(p){return p.pnl>0;}).length;
    var closedPnL=closed.reduce(function(s,p){return s+p.pnl;},0);
    var openPremium=open.reduce(function(s,p){return s+p.pnl;},0);
    var avgPnL=closed.length?closedPnL/closed.length:0;
    var avgDIT=closed.length?closed.reduce(function(s,p){return s+daysInTrade(p);},0)/closed.length:0;
    var pnls=closed.map(function(p){return p.pnl;});

    var tickerMap={};
    closed.concat(open).forEach(function(pos){
      var b=baseTicker(pos.und);
      if(!tickerMap[b])tickerMap[b]={und:b,closed:[],open:[]};
      (pos.isOpen?tickerMap[b].open:tickerMap[b].closed).push(pos);
    });
    var tickers=Object.values(tickerMap).map(function(t){
      var tw=t.closed.filter(function(p){return p.pnl>0;}).length;
      var tpnl=t.closed.concat(t.open).reduce(function(s,p){return s+p.pnl;},0);
      return{und:t.und,total:t.closed.length+t.open.length,
        closedCount:t.closed.length,openCount:t.open.length,
        wins:tw,winRate:t.closed.length?Math.round(tw/t.closed.length*100):0,pnl:tpnl};
    }).sort(function(a,b){return b.pnl-a.pnl;});

    result[strat]={openCount:open.length,closedCount:closed.length,total:open.length+closed.length,
      wins:wins,winRate:closed.length?Math.round(wins/closed.length*100):0,
      closedPnL:closedPnL,openPremium:openPremium,totalPnL:closedPnL+openPremium,
      avgPnL:avgPnL,avgDIT:Math.round(avgDIT),
      best:pnls.length?Math.max.apply(null,pnls):0,worst:pnls.length?Math.min.apply(null,pnls):0,
      tickers:tickers};
  });
  return result;
}
function computeMonthlyPnL(positions){
  var monthly={};
  positions.forEach(function(pos){
    if(pos.isOpen)return;
    var dt=new Date(pos.closeDate);
    var k=dt.getFullYear()+"-"+dt.getMonth();
    monthly[k]=(monthly[k]||0)+pos.pnl;
  });
  return monthly;
}

function StrategyCard({strat,metrics,positions}){
  const s=SMAP[strat]||SMAP.misc;
  const[selTicker,setSelTicker]=React.useState(null);
  if(!metrics)return null;

  /* Compute ticker-specific metrics when one is selected */
  const tm=React.useMemo(()=>{
    if(!selTicker||!positions)return null;
    const fps=positions.filter(p=>baseTicker(p.und)===selTicker);
    const cl=fps.filter(p=>!p.isOpen),op=fps.filter(p=>p.isOpen);
    const wins=cl.filter(p=>p.pnl>0).length;
    const cpnl=cl.reduce((s,p)=>s+p.pnl,0);
    const oprem=op.reduce((s,p)=>s+p.pnl,0);
    const pnls=cl.map(p=>p.pnl);
    return{openCount:op.length,closedCount:cl.length,total:fps.length,
      wins,winRate:cl.length?Math.round(wins/cl.length*100):0,
      closedPnL:cpnl,openPremium:oprem,totalPnL:cpnl+oprem,
      avgPnL:cl.length?cpnl/cl.length:0,
      avgDIT:cl.length?Math.round(cl.reduce((s,p)=>s+daysInTrade(p),0)/cl.length):0,
      best:pnls.length?Math.max.apply(null,pnls):0,
      worst:pnls.length?Math.min.apply(null,pnls):0};
  },[selTicker,positions]);

  const d=tm||metrics; /* display: ticker view or full strategy */

  return(
    <div style={{background:"#0c0c0c",border:"1px solid #1e1e1e",
      borderTop:"2px solid "+s.color,borderRadius:8,padding:"18px 20px",flex:1,minWidth:200}}>

              <span style={{color:"#333",fontSize:12}}>·</span>
              <span style={{fontFamily:"monospace",color:"#ccc",fontSize:13,
                background:"#1a1a1a",padding:"1px 8px",borderRadius:4}}>{selTicker}</span>
              <button onClick={()=>setSelTicker(null)}
                style={{background:"transparent",border:"none",color:"#555",cursor:"pointer",
                  fontSize:12,padding:"0 2px",fontFamily:"inherit",lineHeight:1}}>✕</button>
            </div>
          )}
        </div>
        <span style={{fontSize:12,color:"#666",flexShrink:0}}>{d.total} trades</span>
      </div>

      <div style={{marginBottom:14}}>

      </div>
      <MiniRow label="Realized" value={fmtPnL(d.closedPnL)} valueColor={d.closedPnL>=0?"#4ade80":"#f87171"}/>
      <MiniRow label="Open premium" value={fmtPnL(d.openPremium)} valueColor="#aaa"/>
      <MiniRow label="Avg per trade" value={fmtPnL(d.avgPnL)} valueColor={d.avgPnL>=0?"#4ade80":"#f87171"}/>
      <MiniRow label="Avg hold" value={d.avgDIT+"d"}/>
      <MiniRow label="Best / Worst" value={fmtK(d.best)+" / "+fmtK(d.worst)} valueColor={d.best>0?"#4ade80":"#aaa"}/>

  );
}

                <td style={{fontSize:12,color:"#666",paddingRight:10,verticalAlign:"middle",whiteSpace:"nowrap",fontWeight:500}}>{yr}</td>
                {MONTHS.map((m,mi)=>{
                  const k=yr+"-"+mi;const v=monthlyData[k]||0;const hd=!!monthlyData[k];
                  const bg=hd?(v>=0?"#14532d":"#7f1d1d"):"#0c0c0c";
                  const tc=hd?(v>=0?"#4ade80":"#fca5a5"):"transparent";
                  return(<td key={m} style={{padding:0}}>
                    <div style={{background:bg,border:"1px solid "+(hd?"transparent":"#141414"),
                      borderRadius:5,padding:"8px 4px",textAlign:"center",

function TxnBlock({tx}){
  const mobile=React.useContext(MC);
  const opens=tx.legs.filter(l=>l.ac==="BUY_TO_OPEN"||l.ac==="SELL_TO_OPEN");
  const closes=tx.legs.filter(l=>l.ac==="BUY_TO_CLOSE"||l.ac==="SELL_TO_CLOSE");
  const isRoll=opens.length>0&&closes.length>0;
  const displayOi=tx.oi.startsWith("__exp__")?"Expiration":tx.oi;

  if(isRoll){
    /* Split roll into Close + Open sections — same order, two distinct actions */
    return(
      <div style={{marginBottom:8,background:"#0a0a0a",borderRadius:6,
        padding:"10px 12px",borderLeft:"2px solid #1e1e1e"}}>
        <SubBlock label="Close" color="#888" date={tx.d} orderId={displayOi}
          legs={closes} mobile={mobile} showOrder={true}/>
        <div style={{marginTop:6}}>
          <SubBlock label="Open" color="#4ade80" date={tx.d} orderId={displayOi}
            legs={opens} mobile={mobile} showOrder={false}/>
        </div>
      </div>
    );
  }

  const label=opens.length>0?"Open":"Close";
  const lclr=opens.length>0?"#4ade80":"#888";
  const net=tx.legs.reduce((s,l)=>s+l.to,0);
  return(
    <div style={{marginBottom:8,background:"#0a0a0a",borderRadius:6,
      padding:"10px 12px",borderLeft:"2px solid #1e1e1e"}}>
      <div style={{fontSize:12,color:"#666",marginBottom:8,display:"flex",gap:10,alignItems:"center"}}>
        <span style={{color:lclr,fontWeight:700}}>{label}</span>
        {!mobile&&<span style={{color:"#333"}}>Order {displayOi}</span>}
        <span style={{color:"#444"}}>{fmtD(tx.d)}</span>
        <span style={{marginLeft:"auto",color:net>=0?"#4ade80":"#f87171",
          fontWeight:700,fontFamily:"monospace",fontSize:13}}>{fmtPnL(net)}</span>
      </div>
      <LegTable legs={tx.legs} mobile={mobile}/>
    </div>
  );
}

/* ── GitHub setup modal ── */
function SetupModal({onSave,onSkip}){
  const[repo,setRepo]=React.useState(GH_REPO||'');
  const[pat,setPat]=React.useState('');
  const[state,setState]=React.useState('idle'); /* idle|testing|ok|error */
  const[msg,setMsg]=React.useState('');

  async function handleSave(){
    const r=repo.trim(), p=pat.trim();
    if(!r||!p){setMsg('Both fields are required.');setState('error');return;}
    setState('testing');setMsg('Checking connection…');
    try{
      /* Verify token can read the repo */
      const res=await fetch('https://api.github.com/repos/'+r+'/contents/data.json',
        {headers:{'Authorization':'token '+p,'Accept':'application/vnd.github.v3+json'}});
      if(res.status===401){setState('error');setMsg('Token invalid — check the token and try again.');return;}
      if(res.status===403){setState('error');setMsg('Token lacks permission — needs Contents: Read & Write.');return;}
      if(res.status===404){setState('error');setMsg('Repo or data.json not found. Make sure you committed data.json to the repo.');return;}
      if(!res.ok){setState('error');setMsg('Error '+res.status+' — check the repo name.');return;}
    }catch(e){setState('error');setMsg('Network error — check your connection.');return;}
    /* All good — save */
    localStorage.setItem('tt:ghconfig',JSON.stringify({repo:r,pat:p}));
    GH_REPO=r; GH_PAT=p; _ghSha=null;
    setState('ok');setMsg('Connected to '+r);
    setTimeout(onSave, 800);
  }

  const inp={width:"100%",background:"#0a0a0a",border:"1px solid "+(state==='error'?'#7f1d1d':'#2a2a2a'),
    borderRadius:5,padding:"10px 12px",color:"#fff",fontSize:13,outline:"none",
    fontFamily:"inherit",boxSizing:"border-box"};
  const isTesting=state==='testing';

  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.9)",display:"flex",
      alignItems:"center",justifyContent:"center",zIndex:1000,padding:20}}>
      <div style={{background:"#111",border:"1px solid #222",borderRadius:10,
        padding:"28px 28px 22px",width:"100%",maxWidth:420}}>
        <div style={{fontSize:16,fontWeight:700,color:"#fff",marginBottom:6}}>GitHub Sync</div>
        <div style={{fontSize:13,color:"#666",marginBottom:22,lineHeight:1.6}}>
          Strategy overrides sync to <code style={{color:"#aaa",background:"#0a0a0a",padding:"1px 5px",borderRadius:3}}>data.json</code> in your repo.
          Token stored in this browser only.
        </div>
        <div style={{marginBottom:14}}>
          <div style={{fontSize:11,color:"#888",marginBottom:5,textTransform:"uppercase",letterSpacing:"0.06em"}}>
            GitHub Repo
          </div>
          <input value={repo} onChange={e=>setRepo(e.target.value)} disabled={isTesting}
            placeholder="username/trading-journal" style={inp}/>
        </div>
        <div style={{marginBottom:20}}>
          <div style={{fontSize:11,color:"#888",marginBottom:5,display:"flex",
            alignItems:"center",justifyContent:"space-between"}}>
            <span style={{textTransform:"uppercase",letterSpacing:"0.06em"}}>Personal Access Token</span>
            <a href="https://github.com/settings/personal-access-tokens/new" target="_blank"
              style={{color:"#555",fontSize:10,textDecoration:"none"}}>Create one ↗</a>
          </div>
          <input value={pat} onChange={e=>setPat(e.target.value)} type="password"
            disabled={isTesting} placeholder="ghp_xxxxxxxxxxxx" style={inp}/>
          <div style={{fontSize:11,color:"#555",marginTop:5}}>
            Fine-grained token · Contents: Read &amp; Write · this repo only
          </div>
        </div>

        {/* Status message */}
        {msg&&(
          <div style={{fontSize:12,padding:"9px 12px",borderRadius:5,marginBottom:14,
            background:state==='ok'?"rgba(34,197,94,0.1)":state==='error'?"rgba(239,68,68,0.1)":"rgba(251,191,36,0.1)",
            border:"1px solid "+(state==='ok'?"rgba(34,197,94,0.3)":state==='error'?"rgba(239,68,68,0.3)":"rgba(251,191,36,0.3)"),
            color:state==='ok'?"#4ade80":state==='error'?"#f87171":"#fbbf24"}}>
            {state==='ok'?"✓ ":state==='error'?"✗ ":"⋯ "}{msg}
          </div>
        )}

        <div style={{display:"flex",gap:10}}>
          <button onClick={handleSave} disabled={isTesting}
            style={{flex:1,background:state==='ok'?"#14532d":"#fff",
              color:state==='ok'?"#4ade80":"#000",border:"none",borderRadius:5,
              padding:"11px",fontSize:13,fontWeight:700,cursor:isTesting?"default":"pointer",
              fontFamily:"inherit",opacity:isTesting?0.7:1}}>
            {isTesting?"Checking…":state==='ok'?"Connected ✓":"Save & Connect"}
          </button>
          <button onClick={onSkip} disabled={isTesting}
            style={{background:"transparent",color:"#555",border:"1px solid #222",
              borderRadius:5,padding:"11px 18px",fontSize:13,cursor:"pointer",
              fontFamily:"inherit"}}>
            Skip
          </button>
        </div>
        <div style={{fontSize:11,color:"#333",marginTop:12,textAlign:"center"}}>
          Token never leaves this browser
        </div>
      </div>
    </div>
  );
}

  const[showSetup,setShowSetup]=React.useState(false);
  const[syncSt,setSyncSt]=React.useState('');
  const[keys,setKeys]=React.useState(new Set());
  const[over,setOver]=React.useState({});
  const[page,setPage]=React.useState("dashboard");
  const[tab,setTab]=React.useState("all");
  const[expIds,setExpIds]=React.useState(new Set());
  const[selectedIds,setSelectedIds]=React.useState(new Set());
  const[closedCollapsed,setClosedCollapsed]=React.useState(true);
  const[ready,setReady]=React.useState(false);
  const[toast,setToast]=React.useState(null);

  React.useEffect(()=>{const el=document.getElementById("splash");if(el)el.style.display="none";},[]);
  React.useEffect(()=>{
    (async()=>{
      try{
        if(!GH_REPO||!GH_PAT)setShowSetup(true);
        const d=await storage.load()||{};
        const extraRows=d.rows||[];
        const extraKeys=d.keys||[];
        const allRows=[...INIT_ROWS,...extraRows];
        const allKeys=new Set([...INIT_KEYS,...extraKeys]);
        setRows(allRows);setKeys(allKeys);setOver(d.overrides||{});
      }catch(e){setRows([...INIT_ROWS]);setKeys(new Set(INIT_KEYS));}
      setReady(true);
    })();
  },[]);

  const positions=React.useMemo(()=>buildPositions(rows,over),[rows,over]);
  const totalPnL=React.useMemo(()=>positions.reduce((s,p)=>s+p.pnl,0),[positions]);
  const realizedPnL=React.useMemo(()=>positions.filter(p=>!p.isOpen).reduce((s,p)=>s+p.pnl,0),[positions]);
  const openPnL=React.useMemo(()=>positions.filter(p=>p.isOpen).reduce((s,p)=>s+p.pnl,0),[positions]);
  const tabCounts=React.useMemo(()=>{const c={all:positions.length};positions.forEach(p=>{c[p.strategy]=(c[p.strategy]||0)+1;});return c;},[positions]);
  const filtered=React.useMemo(()=>{const base=tab==="all"?positions:positions.filter(p=>p.strategy===tab);return{open:base.filter(p=>p.isOpen),closed:base.filter(p=>!p.isOpen)};},[positions,tab]);

  const showToast=React.useCallback((msg,type)=>{setToast({msg,type});setTimeout(()=>setToast(null),4000);},[]);
  const handleUpload=React.useCallback(async(file)=>{
    let _added=0,_newRows=[],_newKeys=keys;
    try{
      const text=await file.text();
      const nr=parseCSV(text);
      const{added,newKeys}=dedupeNewRows(nr,[...keys]);
      if(!added.length){showToast("No new transactions — already imported.","info");return;}
      _added=added.length;_newRows=added;_newKeys=newKeys;
      setRows([...rows,...added]);setKeys(newKeys);
      showToast(_added+" new transaction"+(_added!==1?"s":"")+" added.","success");
    }catch(e){showToast("Import failed — check file format.","error");return;}
    /* Storage save in its own try/catch — never affects the success message above */
    try{
      const initKS=new Set(INIT_KEYS);
      const allRows=[...rows,..._newRows];
      const extraR=allRows.slice(INIT_ROWS.length);
      const extraK=[..._newKeys].filter(k=>!initKS.has(k));
      storage.save({overrides:over,rows:extraR,keys:extraK},setSyncSt);
    }catch(e){console.warn("Save error:",e);}
  },[rows,keys,showToast]);
  const handleStrategyChange=React.useCallback(async(pid,strat)=>{
    const updated=Object.assign({},over,{[pid]:strat});setOver(updated);
    try{storage.save({overrides:updated,rows:rows.slice(INIT_ROWS.length),keys:[...keys].filter(k=>!new Set(INIT_KEYS).has(k))},setSyncSt);}catch(e){}
  },[over]);
  const toggleExpand=React.useCallback(id=>{setExpIds(prev=>{const n=new Set(prev);n.has(id)?n.delete(id):n.add(id);return n;});},[]);
  const toggleSelect=React.useCallback(id=>{setSelectedIds(prev=>{const n=new Set(prev);n.has(id)?n.delete(id):n.add(id);return n;});},[]);
  const clearSelection=React.useCallback(()=>setSelectedIds(new Set()),[]);
  const selectGroup=React.useCallback((positions,allSelected)=>{
    setSelectedIds(prev=>{const n=new Set(prev);if(allSelected)positions.forEach(p=>n.delete(p.id));else positions.forEach(p=>n.add(p.id));return n;});
  },[]);
  const handleBulkStrategy=React.useCallback(async(strat)=>{
    const count=selectedIds.size;
    const updated=Object.assign({},over);
    selectedIds.forEach(pid=>{updated[pid]=strat;});
    setOver(updated);setSelectedIds(new Set());
    try{storage.save({overrides:updated,rows:rows.slice(INIT_ROWS.length),keys:[...keys].filter(k=>!new Set(INIT_KEYS).has(k))},setSyncSt);}catch(e){}
    showToast(count+" position"+(count!==1?"s":"")+" moved to "+(SMAP[strat]||SMAP.misc).label+".","success");
  },[selectedIds,over,showToast]);

  const TRADE_TABS=[{k:"all",label:"All"},{k:"112",label:"1-1-2"},{k:"strangle",label:"Strangles"},{k:"credit_spread",label:"Spreads"},{k:"misc",label:"Misc"}];
  const hasSel=selectedIds.size>0;
  const openAllSel=filtered.open.length>0&&filtered.open.every(p=>selectedIds.has(p.id));
  const closedAllSel=filtered.closed.length>0&&filtered.closed.every(p=>selectedIds.has(p.id));
  const bottomPad=hasSel?(isMobile?"130px":"80px"):(isMobile?"20px":"60px");

  if(!ready)return(
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",
      justifyContent:"center",height:"100vh",background:"#000",color:"#555",
      fontFamily:"system-ui,sans-serif",gap:14}}>
      <div style={{width:28,height:28,border:"1px solid #222",borderTopColor:"#fff",
        borderRadius:"50%",animation:"spin 0.8s linear infinite"}}/>
      <span style={{fontSize:13}}>Loading…</span>
      <style>{"@keyframes spin{to{transform:rotate(360deg)}}"}</style>
    </div>
  );

  const navBtn=(active)=>({
    padding:isMobile?"7px 14px":"6px 16px",
    background:active?"#fff":"transparent",
    border:"1px solid "+(active?"#fff":"#222"),cursor:"pointer",
    fontSize:13,color:active?"#000":"#777",borderRadius:4,
    fontFamily:"inherit",fontWeight:active?600:400,transition:"all 0.12s"
  });

  return(
    <MC.Provider value={isMobile}>
    <div style={{fontFamily:'system-ui,-apple-system,"Segoe UI",sans-serif',
      background:"#000",minHeight:"100vh",color:"#fff"}}>

      <header style={{background:"#000",borderBottom:"1px solid #1a1a1a",padding:"0 16px",
        position:"sticky",top:0,zIndex:100}}>
        <div style={{maxWidth:1300,margin:"0 auto"}}>
          {isMobile?(
            <>
              {/* Mobile header: 2 rows */}
              <div style={{display:"flex",alignItems:"center",gap:10,paddingTop:14,paddingBottom:10}}>
                <div style={{flex:1}}>
                  <div style={{fontSize:15,fontWeight:600,color:"#fff"}}>Trading Journal</div>
                  <div style={{fontSize:10,color:"#555",marginTop:1}}>TastyTrade · x5WX56094</div>
                </div>
                <div style={{textAlign:"right",marginRight:8}}>
                  <div style={{fontSize:10,color:"#666"}}>Total P&L</div>
                  <div style={{fontSize:17,fontWeight:700,fontFamily:"monospace",
                    color:totalPnL>=0?"#4ade80":"#f87171"}}>{fmtPnL(totalPnL)}</div>
                </div>
                <label style={{cursor:"pointer",background:"#fff",color:"#000",fontSize:12,
                  fontWeight:700,padding:"8px 12px",borderRadius:4,flexShrink:0}}>
                  ↑ CSV
                  <input type="file" accept=".csv" style={{display:"none"}}
                    onChange={e=>{if(e.target.files[0])handleUpload(e.target.files[0]);e.target.value="";}}/>
                </label>
                <button onClick={()=>setShowSetup(true)}
                style={{background:"transparent",border:"1px solid #1a1a1a",borderRadius:4,padding:"6px 10px",cursor:"pointer",fontFamily:"inherit",display:"flex",alignItems:"center",gap:5,flexShrink:0}}>
                <span style={{fontSize:13,color:syncSt==="synced"?"#4ade80":syncSt==="saving"?"#fbbf24":syncSt.startsWith("error")?"#f87171":GH_REPO?"#4ade80":"#555"}}>⇆</span>
                <span style={{fontSize:11,color:syncSt==="synced"?"#4ade80":syncSt==="saving"?"#fbbf24":syncSt.startsWith("error")?"#f87171":GH_REPO?"#4ade80":"#444"}}>
                  {syncSt||( GH_REPO?"connected":"sync")}
                </span>
              </button>
              </div>
              <div style={{display:"flex",gap:6,paddingBottom:12}}>
                <button style={navBtn(page==="dashboard")} onClick={()=>{setPage("dashboard");clearSelection();}}>Dashboard</button>
                <button style={navBtn(page==="trades")} onClick={()=>setPage("trades")}>Trades</button>
                <div style={{marginLeft:"auto",display:"flex",gap:10,alignItems:"center"}}>
                  <div style={{textAlign:"right"}}>
                    <div style={{fontSize:10,color:"#555"}}>Realized</div>
                    <div style={{fontSize:13,fontWeight:700,fontFamily:"monospace",
                      color:realizedPnL>=0?"#4ade80":"#f87171"}}>{fmtPnL(realizedPnL)}</div>
                  </div>
                  <div style={{textAlign:"right"}}>
                    <div style={{fontSize:10,color:"#555"}}>Open</div>
                    <div style={{fontSize:13,fontWeight:700,fontFamily:"monospace",color:"#555"}}>{fmtPnL(openPnL)}</div>
                  </div>
                </div>
              </div>
            </>
          ):(
            /* Desktop header */
            <div style={{display:"flex",alignItems:"center",gap:14,paddingTop:16,paddingBottom:16,flexWrap:"wrap"}}>
              <div style={{marginRight:6}}>
                <div style={{fontSize:15,fontWeight:600,color:"#fff",letterSpacing:"-0.3px"}}>Trading Journal</div>
                <div style={{fontSize:11,color:"#555",marginTop:2}}>TastyTrade · x5WX56094</div>
              </div>
              <button style={navBtn(page==="dashboard")} onClick={()=>{setPage("dashboard");clearSelection();}}>Dashboard</button>
              <button style={navBtn(page==="trades")} onClick={()=>setPage("trades")}>Trades</button>
              <div style={{display:"flex",gap:24,marginLeft:"auto",alignItems:"center",flexWrap:"wrap"}}>
                <div><div style={{fontSize:11,color:"#666",textAlign:"right"}}>Total P&L</div>
                  <div style={{fontSize:20,fontWeight:700,fontFamily:"monospace",color:totalPnL>=0?"#4ade80":"#f87171"}}>{fmtPnL(totalPnL)}</div></div>
                <div><div style={{fontSize:11,color:"#666",textAlign:"right"}}>Realized</div>
                  <div style={{fontSize:14,fontWeight:700,fontFamily:"monospace",color:realizedPnL>=0?"#4ade80":"#f87171"}}>{fmtPnL(realizedPnL)}</div></div>
                <div><div style={{fontSize:11,color:"#666",textAlign:"right"}}>Open</div>
                  <div style={{fontSize:14,fontWeight:700,fontFamily:"monospace",color:"#666"}}>{fmtPnL(openPnL)}</div></div>
                <label style={{cursor:"pointer",background:"#fff",color:"#000",fontSize:13,
                  fontWeight:600,padding:"8px 18px",borderRadius:4,flexShrink:0,whiteSpace:"nowrap"}}>
                  ↑ Import CSV
                  <input type="file" accept=".csv" style={{display:"none"}}
                    onChange={e=>{if(e.target.files[0])handleUpload(e.target.files[0]);e.target.value="";}}/>
                </label>
              <button onClick={()=>setShowSetup(true)}
                style={{background:"transparent",border:"1px solid #1a1a1a",borderRadius:4,padding:"6px 10px",cursor:"pointer",fontFamily:"inherit",display:"flex",alignItems:"center",gap:5,flexShrink:0}}>
                <span style={{fontSize:13,color:syncSt==="synced"?"#4ade80":syncSt==="saving"?"#fbbf24":syncSt.startsWith("error")?"#f87171":GH_REPO?"#4ade80":"#555"}}>⇆</span>
                <span style={{fontSize:11,color:syncSt==="synced"?"#4ade80":syncSt==="saving"?"#fbbf24":syncSt.startsWith("error")?"#f87171":GH_REPO?"#4ade80":"#444"}}>
                  {syncSt||( GH_REPO?"connected":"sync")}
                </span>
              </button>
              </div>
            </div>
          )}
          {page==="trades"&&(
            <div style={{display:"flex",overflowX:"auto",borderTop:"1px solid #111",
              WebkitOverflowScrolling:"touch"}}>
              {TRADE_TABS.map(t=>{
                const active=tab===t.k;const sc=t.k!=="all"?SMAP[t.k]:null;
                return(
                  <button key={t.k} onClick={()=>{setTab(t.k);clearSelection();}}
                    style={{padding:isMobile?"9px 12px":"9px 16px",background:"transparent",border:"none",
                      cursor:"pointer",fontSize:isMobile?12:13,color:active?"#fff":"#666",
                      borderBottom:active?"2px solid "+(sc?sc.color:"#fff"):"2px solid transparent",
                      fontFamily:"inherit",fontWeight:active?600:400,whiteSpace:"nowrap",
                      display:"flex",alignItems:"center",gap:5}}>
                    {t.label}
                    <span style={{fontSize:10,color:active?"#888":"#333",background:"#111",
                      padding:"1px 5px",borderRadius:8}}>{tabCounts[t.k]||0}</span>
                  </button>
                );
              })}
            </div>
          )}
        </div>
      </header>

      {page==="dashboard"&&<DashboardPage positions={positions} rows={rows} money={INIT_MONEY}/>}

      {page==="trades"&&(
        <div>

          <main style={{maxWidth:1300,margin:"0 auto",padding:"4px "+(isMobile?"14px":"20px")+" "+bottomPad}}>
            {(filtered.open.length+filtered.closed.length)===0
              ?<div style={{textAlign:"center",color:"#444",padding:"60px 0",fontSize:14}}>No positions in this category</div>
              :<>
                {filtered.open.length>0&&<>
                  <SectionLabel label="Open" count={filtered.open.length}
                    pnl={filtered.open.reduce((s,p)=>s+p.pnl,0)}
                    allSelected={openAllSel} onSelectAll={()=>selectGroup(filtered.open,openAllSel)}/>
                  {filtered.open.map(pos=>(<PositionRow key={pos.id} pos={pos} expanded={expIds.has(pos.id)}
                    onToggle={()=>toggleExpand(pos.id)} onStrategyChange={s=>handleStrategyChange(pos.id,s)}
                    selected={selectedIds.has(pos.id)} onSelect={()=>toggleSelect(pos.id)}/>))}
                </>}
                {filtered.closed.length>0&&<>
                  <SectionLabel label="Closed" count={filtered.closed.length}
                    pnl={filtered.closed.reduce((s,p)=>s+p.pnl,0)}
                    allSelected={closedAllSel} onSelectAll={()=>selectGroup(filtered.closed,closedAllSel)}
                    collapsed={closedCollapsed} onToggle={()=>setClosedCollapsed(c=>!c)}/>
                  {!closedCollapsed&&filtered.closed.map(pos=>(<PositionRow key={pos.id} pos={pos} expanded={expIds.has(pos.id)}
                    onToggle={()=>toggleExpand(pos.id)} onStrategyChange={s=>handleStrategyChange(pos.id,s)}
                    selected={selectedIds.has(pos.id)} onSelect={()=>toggleSelect(pos.id)}/>))}
                </>}
              </>
            }
          </main>
        </div>
      )}

      {hasSel&&<BulkBar count={selectedIds.size} onClear={clearSelection} onApply={handleBulkStrategy}/>}
      {toast&&<Toast msg={toast.msg} type={toast.type}/>}
      {showSetup&&<SetupModal onSave={()=>setShowSetup(false)} onSkip={()=>setShowSetup(false)}/>}
    </div>
    </MC.Provider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

</script>
</body>
</html>
